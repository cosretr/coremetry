name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid burning minutes on duplicate runs when force-pushing or rapid PR
# updates: cancel any in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci || npm install
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      # ADVISORY (v0.7.49): ESLint over the existing ~108-finding baseline
      # (incl. real react-hooks/rules-of-hooks violations queued as bug-fixes).
      # Non-blocking until triaged; drop the `|| echo` to make it a gate.
      # v0.10.626 — ESLint artık GERÇEK kapı (denetim §4.4 #2): 0 hata, uyarılar
      # geçer (238 uyarı tabanı ayrı ratchet işi). `|| echo` advisory'si kalktı.
      - name: ESLint
        working-directory: frontend
        run: npx eslint src
      # First frontend test gate (v0.7.25). Vitest over the pure lib/ helpers
      # that carry incident history (unit formatters, timeRangeToNs now()-trap,
      # escapeHTML XSS, dashboard-var expansion). Runs before the build so a
      # broken helper fails fast.
      - name: Unit tests (vitest)
        working-directory: frontend
        run: npx vitest run
      - name: Build (Vite SPA)
        working-directory: frontend
        run: npx vite build
      - name: Upload built UI for the Go job
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  backend:
    name: Backend (vet + build + test)
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          # check-latest: the hosted runner's toolcache can lag a patch
          # behind (v0.8.557 incident: cache served 1.25.11 while the
          # crypto/tls fix GO-2026-5856 landed in 1.25.12, so the hard
          # govulncheck gate red-balled main on a vuln that was already
          # fixed upstream). Resolving latest costs a few seconds and
          # keeps the security gate scanning the stdlib we actually ship.
          check-latest: true
          cache: true
      # main.go uses //go:embed all:frontend/dist, so the Go build
      # needs the Vite-rendered SPA from the frontend job.
      - name: Pull built UI
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      # v0.10.626 — release imajı statik (Dockerfile CGO_ENABLED=0); cgo'suz
      # derleme CI'da hiç kontrol edilmiyordu, ilk kez sürüm anında düşerdi.
      - name: go build (CGO_ENABLED=0, release imajıyla aynı)
        run: CGO_ENABLED=0 go build ./...
      # v0.10.625 — api.go BÜYÜMEZ (ratchet): taban .claude/baselines/api_go_lines;
      # büyüme ve indirilmemiş taban ikisi de kırmızı (GUARD_STRICT_RATCHET=1).
      - name: api.go büyüme kapısı (ratchet)
        run: GUARD_STRICT_RATCHET=1 bash scripts/guard-api-go-size.sh --worktree
      # v0.10.628 — gofmt borcu tek sweep ile kapandı (86 dosya, dört toolchain'de
      # aynı liste = gerçek borç). Bundan sonra biçimsiz dosya kırmızı.
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "gofmt farkı:"; echo "$out"; exit 1; fi
      # CLAUDE.md's release flow requires "go test ./... pre-tag", and every
      # bug-fix ships a regression test — but nothing ENFORCED it in CI, so a
      # forgotten local run could ship a regression undetected. This is the gate.
      - name: go test
        run: go test ./...
      # v0.10.626 — CLAUDE.md release akışının iki kapısı CI'da yoktu:
      # make audit (9 grep kontrolü, 🔴 = kırmızı) ve go mod tidy farkı.
      - name: make audit (repo kuralları)
        run: make audit
      - name: go mod tidy -diff
        run: go mod tidy -diff

      # v0.9.584 — GERÇEK ClickHouse'a karşı tip duman testi.
      #
      # Bu sınıf (derlenen ama CH'de patlayan sorgu) üç kez prod'a
      # çıktı: v0.9.543 (struct↔kolon tipi), v0.9.572 (toStartOfInterval
      # dönüş tipi), v0.9.578 (time_bucket bağlama tipi). Üçünü de saf
      # fonksiyon testleri kaçırdı çünkü SQL'e hiç dokunmuyorlardı.
      #
      # Boş bir CH yeter: satır dönmesi beklenmiyor, aranan tek şey
      # sorgunun hatasız çalışması. Tip/sözdizimi hataları boş tabloda
      # da patlar.
      - name: ClickHouse başlat (tip duman testi)
        run: |
          docker run -d --name ch-smoke -p 19000:9000 \
            -e CLICKHOUSE_SKIP_USER_SETUP=1 \
            clickhouse/clickhouse-server:24.8
          for i in $(seq 1 60); do
            if docker exec ch-smoke clickhouse-client --query "SELECT 1" >/dev/null 2>&1; then
              echo "ClickHouse hazır ($i sn)"; exit 0
            fi
            sleep 1
          done
          echo "ClickHouse 60 sn içinde hazır olmadı"; docker logs ch-smoke | tail -30; exit 1

      - name: CH tip duman testi
        env:
          CH_SMOKE_ADDR: localhost:19000
        run: go test -tags=chsmoke ./internal/chstore/ -run TestCHSmokeReads -v

      - name: ClickHouse durdur
        if: always()
        run: docker rm -f ch-smoke || true
      # Race detector on the concurrency-heavy packages (background agent runner,
      # notifier fan-out, SSE broker, Redis cache/locks) where a data race would
      # otherwise hide until a production heisenbug.
      - name: go test -race (concurrency packages)
        run: go test -race ./internal/agent/... ./internal/notify/... ./internal/sse/... ./internal/cache/...

  lint:
    name: Lint (golangci-lint)
    needs: frontend
    runs-on: ubuntu-latest
    # HARD GATE since v0.10.639: the standard-set baseline was triaged to
    # zero in v0.10.634-638 (SA4000 determinism idiom, unused, errcheck
    # policy, staticcheck/govet/ineffassign). Intentional patterns live in
    # .golangci.yml with a version-stamped reason; a new finding fails the
    # job. Caps are lifted below so nothing hides behind the 50/3 defaults.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          # check-latest: the hosted runner's toolcache can lag a patch
          # behind (v0.8.557 incident: cache served 1.25.11 while the
          # crypto/tls fix GO-2026-5856 landed in 1.25.12, so the hard
          # govulncheck gate red-balled main on a vuln that was already
          # fixed upstream). Resolving latest costs a few seconds and
          # keeps the security gate scanning the stdlib we actually ship.
          check-latest: true
          cache: true
      # golangci-lint compiles the package graph → needs the //go:embed SPA.
      - name: Pull built UI
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          # v0.10.639: hard gate. golangci's defaults cap output at 50 per
          # linter / 3 per identical issue and hid the true total (the audit's
          # "123" was a capped number; uncapped it was 143). Lift the caps so
          # the gate — and any local run mirroring it — sees everything.
          args: --max-issues-per-linter 0 --max-same-issues 0

  security:
    name: Security (vuln + dep scan)
    needs: frontend
    runs-on: ubuntu-latest
    # HARD GATE (v0.8.554) — the v0.7.34 advisory period is over: the
    # baseline was cleaned in v0.8.552 (npm: 0 critical/high) and v0.8.553
    # (govulncheck: 0 reachable), and all three scanners were verified
    # exit-0 locally before this flip. A freshly-disclosed CVE now
    # redballs the PR — that is the point; triage happens by fixing or
    # pinning, not by merging past it.
    permissions:
      contents: read
      # upload-sarif writes code-scanning alerts (Trivy results → Security tab).
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          # check-latest: the hosted runner's toolcache can lag a patch
          # behind (v0.8.557 incident: cache served 1.25.11 while the
          # crypto/tls fix GO-2026-5856 landed in 1.25.12, so the hard
          # govulncheck gate red-balled main on a vuln that was already
          # fixed upstream). Resolving latest costs a few seconds and
          # keeps the security gate scanning the stdlib we actually ship.
          check-latest: true
          cache: true
      # main.go embeds frontend/dist (//go:embed) — govulncheck type-checks +
      # builds the package graph, so it needs the rendered SPA like the backend
      # job does. Pull the artifact instead of rebuilding the frontend here.
      - name: Pull built UI
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      # govulncheck only flags vulnerabilities in code paths actually REACHED
      # (call-graph analysis), so false positives are rare — which is what
      # makes it safe as a blocking gate.
      - name: govulncheck (Go reachable CVEs)
        run: |
          # v0.10.622 — @latest DEĞİL: x/vuln v1.8.0 go >= 1.26 istiyor, bu job go 1.25
          # + GOTOOLCHAIN=local ile koşuyor ve 2026-09-10'da kurulum adımı düştü
          # (main kırmızı, kod değişmeden). v1.7.0 = go 1.25 ile derlenen son sürüm;
          # toolchain yükseltilince (go.mod) birlikte güncellenir.
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      # Policy unchanged: HIGH + CRITICAL block, moderate does not (10 exist
      # with no non-major fix). What changed (v0.9.266) is that a gate can no
      # longer be turned red by the advisory endpoint having a bad day —
      # exactly the failure mode the Trivy comment below records for v0.9.74.
      #
      # `npm audit` exits non-zero for TWO unrelated reasons: it found
      # vulnerabilities, or it could not reach/parse the advisory API. The old
      # one-liner could not tell them apart. Since 2026-07-25 the quick-audit
      # endpoint has been returning `400 Invalid package tree` in CI and
      # malformed gzip locally, while announcing its own retirement in the
      # same breath ("This endpoint is being retired. Use the bulk advisory
      # endpoint instead."). The tree is fine — `npm ci --dry-run` resolves
      # clean — so the build was red for an outage, with no security signal
      # either way. That trains people to ignore a red gate, which is worse
      # than the outage.
      #
      # So: parse the report. A real report enforces high+critical. An
      # unreachable endpoint warns loudly AND still verifies lockfile
      # integrity, which is the one thing the 400 actually accused us of and
      # the old step never really checked.
      - name: npm audit (frontend deps)
        working-directory: frontend
        run: |
          set +e
          raw=$(npm audit --json 2>/tmp/npm-audit.err)
          set -e
          if printf '%s' "$raw" | jq -e '.metadata.vulnerabilities' >/dev/null 2>&1; then
            hi=$(printf '%s' "$raw" | jq '.metadata.vulnerabilities.high + .metadata.vulnerabilities.critical')
            echo "npm audit: $hi high/critical advisories"
            if [ "$hi" -gt 0 ]; then
              printf '%s' "$raw" | jq '.vulnerabilities | to_entries[] | select(.value.severity=="high" or .value.severity=="critical") | {name: .key, severity: .value.severity, via: .value.via, fixAvailable: .value.fixAvailable}'
              echo "::error::npm audit found $hi high/critical advisories"
              exit 1
            fi
          else
            echo "::warning::npm audit could not run — advisory endpoint unreachable or returned a malformed body. Dependency tree integrity is still enforced below."
            head -5 /tmp/npm-audit.err || true
            # The 400 claims "Invalid package tree" — check that claim for real.
            # This DOES fail the build if package-lock.json and package.json
            # genuinely disagree.
            npm ci --dry-run >/dev/null
            echo "lockfile verified: package-lock.json resolves clean against package.json"
          fi
      # Trivy filesystem scan: catches vulnerable pinned versions in go.sum /
      # package-lock.json that govulncheck's reachability filter skips, plus
      # any leaked secret / misconfig. exit-code 1 on HIGH/CRITICAL — the
      # SARIF upload below still runs (if: always()) so the Security tab
      # sees the findings that failed the gate.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        env:
          # offline-scan (v0.8.559 niyeti, v0.9.74'te DÜZELTİLDİ):
          # jboss-demo pom'unun parent BOM'larını tararken
          # Maven Central'a çıkılıyor; runner IP'si Central'ın rate-limit
          # havuzunu tüm GitHub'la paylaştığından 429 (Retry-After: 1800)
          # trivy'yi FATAL'lıyor ve gate'i bir dış servisin keyfine göre
          # kırmızıya çeviriyordu. offline-scan trivy-action'ın GEÇERLİ
          # bir INPUT'u DEĞİL (sessizce warn'layıp yok sayıyordu — CI hep
          # 429'a düşüyordu); trivy binary --offline-scan'i BU env
          # değişkeninden okur ve action onu geçirir. Lockfile taramaları
          # (go.sum, package-lock) aynen sürer; yalnız uzak pom inheritance
          # atlanır ve o pom'lar shipped binary'nin değil demo
          # üreteçlerinin.
          TRIVY_OFFLINE_SCAN: 'true'
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          # v0.9.93 — limit-severities-for-sarif: trivy-action format=sarif
          # iken bu input false (varsayılan) olduğunda TRIVY_SEVERITY'yi
          # sessizce UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'e GENİŞLETİYOR
          # (log: "Building SARIF report with all severities") ve exit-code'u
          # O küme üzerinden hesaplıyor — yani severity: HIGH,CRITICAL yazsak
          # bile gate pratikte HER severity'de kırmızıya dönüyordu. v0.9.85'ten
          # beri taze açıklanan MEDIUM/UNKNOWN CVE'ler gate'i düşürdü:
          # x/text CVE-2026-56852, x/net CVE-2026-46600, x/crypto GO-2026-5932
          # (fix YOK, UNKNOWN), go-ntlmssp CVE-2026-32952, @otel/core
          # CVE-2026-54285 (frontend build dep) — dep sürümleri v0.9.84'ten
          # beri DEĞİŞMEDİ, yani salt-DB kaynaklı yeni disclosure'lar.
          # govulncheck (erişilebilirlik kapısı, aynı job) HEPSİNİ UNREACHABLE
          # bırakıp GEÇİYOR ve hiçbiri HIGH/CRITICAL değil. true = SARIF ve
          # exit-code YENİDEN sadece HIGH,CRITICAL'e bakar (ci.yml'in belgelenen
          # niyeti). Gerçek bir HIGH/CRITICAL çıkarsa gate yine kırmızı yapar.
          limit-severities-for-sarif: true
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif
          # v0.9.77 — jboss-demo: pom-taşıyan demo yük üreteci,
          # shipped Go binary DEĞİL. tomcat/spring bulguları (24 HIGH/CRIT)
          # ürünle alakasız; taramaya dahil etmek gate'i demo bağımlılığına
          # bağlıyor. node_modules/dist zaten build çıktısı.
          skip-dirs: frontend/node_modules,frontend/dist,jboss-demo
      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  helm:
    name: Helm (lint + template)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: 'v3.15.0'
      - name: helm lint
        run: helm lint charts/coremetry
      # Render with optional features on so we catch broken conditionals
      # that the lint pass alone would miss.
      - name: helm template (full features)
        run: |
          helm template ci charts/coremetry \
            --set ingress.enabled=true \
            --set 'ingress.hosts[0].host=ci.example.com' \
            --set 'ingress.hosts[0].paths[0].path=/' \
            --set 'ingress.hosts[0].paths[0].pathType=Prefix' \
            --set autoscaling.enabled=true \
            --set config.auth.oidc.enabled=true \
            --set config.auth.oidc.issuerUrl=https://example.com \
            --set secrets.jwtSecret=ci-test \
            > /dev/null
