name: Release

on:
  push:
    tags: ['v*.*.*']
  # Manual trigger so a maintainer can re-publish without re-tagging.
  workflow_dispatch:

permissions:
  contents: write       # create release + push to gh-pages branch
  packages: write       # push image to ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # cosretr/coremetry (org transferi 2026-09-10)

jobs:
  # v0.10.626 — YAYIN ÖNCESİ DOĞRULAMA (denetim §4.1): release.yml CI'a bağlı
  # değildi, kırmızı main'den de imaj/chart basıyordu. docker ve helm bu
  # job'a `needs` ile bağlı; kapılar ci.yml'in çekirdeğiyle aynı.
  gate:
    name: Gate (build + test before publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend typecheck + build
        working-directory: frontend
        run: |
          npm ci || npm install
          npx tsc --noEmit
          npm run build
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          check-latest: true
          cache: true
      - name: Go vet + build + test
        run: |
          go vet ./...
          CGO_ENABLED=0 go build ./...
          go test ./...
      - name: make audit
        run: make audit
  docker:
    name: Build + push Docker image
    runs-on: ubuntu-latest
    needs: [gate]
    # continue-on-error: a failed Docker push (typically a
    # GHCR write_package permission_denied when the orphan
    # package from a prior repo deletion blocks the new
    # repo's GITHUB_TOKEN) shouldn't kill the rest of the
    # release. Helm chart + GitHub Release entry still ship,
    # and a maintainer can re-run the Docker step manually
    # once the package linkage is fixed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # v0.8.390 — operator-reported: the release notes cite the git
            # tag verbatim (v0.8.389) but semver {{version}} STRIPS the v,
            # so pulls of the documented tag 404'd. Publish the git-tag
            # spelling too; both now work.
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      # amd64 only by default — building arm64 via QEMU on the free
      # ubuntu-latest runner takes 15–20 min per release. OpenShift
      # clusters are overwhelmingly x86, so this covers ~95% of users.
      # If you need arm64 (Apple Silicon dev, AWS Graviton), set
      # vars.BUILD_PLATFORMS=linux/amd64,linux/arm64 in repo settings.
      # v0.9.340 — stamp the release tag INTO the image.
      #
      # This step passed no build-args at all, so every published image took
      # the Dockerfile defaults: ARG VERSION=dev and ARG VITE_APP_VERSION=dev.
      # That means the Go binary's ldflag, the /app/VERSION file the Dockerfile
      # writes from the same ARG, and the frontend bundle constant were ALL
      # "dev" on every official release. The chart got the real number (the
      # sed step below rewrites appVersion), so the mismatch was invisible from
      # the outside — Helm said 0.9.x while the running binary said dev.
      #
      # Operator-reported symptom: the login screen shows a version locally
      # (local builds pass --build-arg) but not in prod.
      #
      # GITHUB_REF_NAME is the tag, e.g. v0.9.340. Passed with the leading "v"
      # so the displayed string matches the git tag exactly, which is what an
      # operator compares against.
      - name: Build + push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ vars.BUILD_PLATFORMS || 'linux/amd64' }}
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            VITE_APP_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Package + publish Helm chart (OCI)
    # Helm chart push doesn't depend on the Docker image
    # being on GHCR — the chart references an image tag but
    # the registry resolves it at deploy time. Decoupling
    # lets the chart ship even when Docker hits the orphan-
    # package permission issue.
    runs-on: ubuntu-latest
    needs: [gate]
    # Helm OCI push goes to the same GHCR registry, so it can
    # trip the same orphan-package permission issue. Allow it
    # to fail without killing the GitHub Release step.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
        with:
          version: 'v3.15.0'
      - name: Sync Chart appVersion to git tag
        run: |
          # Strip the leading "v" from refs/tags/v0.1.0 → 0.1.0
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/^version:.*/version: $VERSION/"     charts/coremetry/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" charts/coremetry/Chart.yaml
      - name: Package chart
        run: helm package charts/coremetry --destination .helm-out
      # Push the chart as an OCI artifact to GHCR — modern way to
      # distribute Helm charts. Lands at:
      #   oci://ghcr.io/${{ github.repository_owner }}/charts/coremetry:<version>
      # which `helm install coremetry oci://ghcr.io/.../charts/coremetry --version X`
      # can pull directly without a separate index repo (no gh-pages dance).
      - name: Login to GHCR for Helm OCI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              -u "${{ github.actor }}" --password-stdin
      - name: Push chart to OCI
        run: |
          helm push .helm-out/coremetry-${VERSION}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/charts

  release:
    name: GitHub Release
    # No `needs:` — docker / helm can both fail without
    # blocking the GitHub Release notes entry. The notes
    # reference the expected image / chart URLs; if those
    # didn't actually publish, a maintainer re-runs the
    # specific failing job after fixing GHCR permissions.
    # `if: always()` ensures we run even when upstream jobs
    # in the same workflow failed.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Chart sürümü `v`SİZ. `helm` job'ındaki "Sync Chart appVersion"
      # adımı da bunu yapıyor ama O AYRI BİR JOB — env oraya taşınmaz,
      # `env.VERSION` burada BOŞ olurdu. Aynı hesabı burada tekrarlamak
      # kopyalamak gibi görünüyor; alternatifi (job output'u) `if: always()`
      # + `needs:` YOKLUĞU ile çelişirdi: bu job helm job'ı çökse bile
      # koşmak zorunda, dolayısıyla ondan veri bekleyemez.
      - name: Chart version (strip leading v)
        id: chartver
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # ⚠ v0.9.1383 — bu gövde İKİ kez yanlıştı ve her sürüm notunda
          # operatöre kopyalanabilir bir komut olarak sunuluyordu:
          #   1. Yol `…/coremetry-chart` diyordu; gerçek push hedefi
          #      `oci://ghcr.io/<owner>/charts` (yukarıdaki "Push chart to
          #      OCI" adımı), yani chart `…/charts/coremetry` altına iner.
          #      Doğru yazım README.md ve templates/NOTES.txt'te ZATEN
          #      vardı — yanlış olan tek yer burasıydı.
          #   2. `--version ${{ github.ref_name }}` baştaki `v`yi taşıyordu;
          #      helm onu kabul etmez ve paketlenen dosya zaten `v`siz
          #      ("Sync Chart appVersion" adımı `${GITHUB_REF_NAME#v}`
          #      kullanıyor). Yani sürümü doğru yazsan bile komut patlardı.
          # Kopyalayan operatör 404 alıyordu; imaj satırı doğruydu, o yüzden
          # hata "chart yayınlanmamış" gibi okunuyordu.
          body: |
            Docker image: `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
            Helm chart:   `helm install coremetry oci://ghcr.io/${{ github.repository_owner }}/charts/coremetry --version ${{ steps.chartver.outputs.v }}`
