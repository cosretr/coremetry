{{/*
  v0.6.2 — distributed topology: three Deployments running the same
  image with different COREMETRY_MODE values. Banks running at scale
  use this to scale receivers (ingest) independently from the read
  fleet (api) while keeping background workloads (worker) singleton.

  Selector labels include a per-role `app.kubernetes.io/component`
  suffix (coremetry-ingest / coremetry-api / coremetry-worker) so a
  later mode switch (distributed → monolithic) doesn't accidentally
  adopt orphaned distributed-mode pods.

  Pod spec is intentionally inlined per-role rather than factored
  into a named template. Helm named templates obscure indentation
  and make `helm template | less` harder to scan when debugging a
  deploy; the small amount of duplication here is the readability
  price. Diffs between roles read as obvious local additions.
*/}}
{{- if eq (default "monolithic" .Values.deployment.mode) "distributed" -}}
{{- include "coremetry.validateExtras" . -}}
{{- $fullname := include "coremetry.fullname" . -}}
{{- /* v0.10.958 — "extras": extraEnv / envFrom / extraVolumes /
       extraVolumeMounts bu role render edilsin mi. tokenRef çözen üç rol:
       api (okuma yolu + Test probe'ları), worker (arka plan işleri) ve
       ingest — VictoriaMetrics OTLP metrik YAZIMI yalnız ingest pod'unda
       koşar (main.go vmForward), VM tokenRef'i orada çözülmezse yazım
       Authorization'sız gider (api'deki Test yine yeşil görünür). agent
       HARİÇ: bash adımı pod ortamını devralır — sır oraya bilinçli
       taşınmaz (values.yaml). */}}
{{- $roles := list
  (dict "name" "ingest" "mode" "ingest" "replicas" .Values.deployment.roles.ingest.replicas "resources" .Values.deployment.roles.ingest.resources "extras" true)
  (dict "name" "api"    "mode" "api"    "replicas" .Values.deployment.roles.api.replicas    "resources" .Values.deployment.roles.api.resources    "extras" true)
  (dict "name" "worker" "mode" "worker" "replicas" .Values.deployment.roles.worker.replicas "resources" .Values.deployment.roles.worker.resources "extras" true)
-}}
{{- if .Values.deployment.roles.agent.enabled }}
{{- /* v0.7.4 — runbook agent role: executes http/javascript/bash steps in an
       isolated, non-data-plane pod. Multiple replicas are HA-safe (each
       automated step is claimed via a per-execution Redis lock). */}}
{{- $roles = append $roles (dict "name" "agent" "mode" "agent" "replicas" .Values.deployment.roles.agent.replicas "resources" .Values.deployment.roles.agent.resources "extras" false) }}
{{- end }}
{{- range $role := $roles }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-{{ $role.name }}
  labels:
    {{- include "coremetry.labels" $ | nindent 4 }}
    app.kubernetes.io/component: coremetry-{{ $role.name }}
spec:
  # Worker stays at 1 because every job underneath it
  # (evaluator/anomaly/topology/Drain/etc.) is leader-elected via
  # Redis lock — running multiple workers wastes the lock arbitration
  # without parallelising the work. Ingest + api scale freely.
  replicas: {{ $role.replicas }}
  # v0.8.349 (HA audit) — the v0.8.193 maxUnavailable:0 invariant was
  # monolithic-only; the distributed roles fell back to the k8s default
  # (25% unavailable), and the INGEST role is precisely the Deployment
  # behind the headless Service whose empty endpoint set wedges the
  # collector's dns:///round_robin exporter. Same knobs as monolithic.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ ($.Values.deployment.rollingUpdate | default dict).maxUnavailable | default 0 }}
      maxSurge: {{ ($.Values.deployment.rollingUpdate | default dict).maxSurge | default 1 }}
  selector:
    matchLabels:
      {{- include "coremetry.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: coremetry-{{ $role.name }}
  template:
    metadata:
      labels:
        {{- include "coremetry.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: coremetry-{{ $role.name }}
        {{- with $.Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- if not $.Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
        {{- end }}
        {{- with $.Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "coremetry.serviceAccountName" $ }}
      {{- include "coremetry.imagePullSecrets" (dict "imageRoot" $.Values.image "global" $.Values.global) | nindent 6 }}
      # No wait-for-clickhouse init container: chstore.New() retries the CH
      # connection for ~2 min at boot (24 attempts, internal/chstore/store.go),
      # so each role handles a not-yet-ready ClickHouse itself. An init
      # container shelling out to `nc` is redundant and a needless failure
      # point on minimal / distroless images (busybox `nc -z` is not always
      # present).
      {{- with $.Values.podSecurityContext }}
      securityContext: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: coremetry
          image: {{ include "coremetry.image" (dict "imageRoot" $.Values.image "global" $.Values.global "defaultTag" $.Chart.AppVersion) | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- with $.Values.securityContext }}
          securityContext: {{ toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8088
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            {{- if $.Values.service.otlpHttp }}
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            {{- end }}
          env:
            - name: COREMETRY_MODE
              value: {{ $role.mode | quote }}
            - name: COREMETRY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "coremetry.secretName" $ }}
                  key: jwt-secret
                  optional: true
            - name: COREMETRY_CH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "coremetry.secretName" $ }}
                  key: clickhouse-password
                  optional: true
            {{- if $.Values.clickhouse.clusterName }}
            - name: COREMETRY_CH_CLUSTER_NAME
              value: {{ $.Values.clickhouse.clusterName | quote }}
            {{- end }}
            {{- if $.Values.clickhouse.replicaPath }}
            - name: COREMETRY_CH_REPLICA_PATH
              value: {{ $.Values.clickhouse.replicaPath | quote }}
            {{- end }}
            {{- if $.Values.clickhouse.shardKey }}
            - name: COREMETRY_CH_SHARD_KEY
              value: {{ $.Values.clickhouse.shardKey | quote }}
            {{- end }}
            - name: COREMETRY_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "coremetry.secretName" $ }}
                  key: initial-admin-password
                  optional: true
            {{- if $.Values.config.auth.oidc.enabled }}
            - name: COREMETRY_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "coremetry.secretName" $ }}
                  key: oidc-client-secret
            {{- end }}
            {{- $redisURL := include "coremetry.redisURL" $ }}
            {{- if $redisURL }}
            - name: COREMETRY_REDIS_URL
              value: {{ $redisURL | quote }}
            {{- end }}
            {{- if $.Values.selfObs.enabled }}
            - name: COREMETRY_SELF_OBS_OTLP_ENDPOINT
              value: {{ $.Values.selfObs.endpoint | default (printf "%s-otelcol:%v" (include "coremetry.fullname" $) $.Values.otelCollector.service.grpcPort) | quote }}
            - name: COREMETRY_SELF_OBS_SAMPLE_RATE
              value: {{ $.Values.selfObs.sampleRate | quote }}
            {{- end }}
            {{- if $.Values.selfObs.enabled }}
            # v0.10.91 — selfobs k8s kimliği (downward API, RBAC'sız);
            # monolitik şablondaki blokla aynı, kapsam $ (range içi).
            - name: COREMETRY_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: COREMETRY_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: COREMETRY_K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: COREMETRY_K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- end }}
            {{- if eq (default "clickhouse" $.Values.logs.backend) "elasticsearch" }}
            - name: COREMETRY_LOGS_BACKEND
              value: "elasticsearch"
            - name: COREMETRY_ES_ADDRESSES
              value: {{ join "," $.Values.logs.elasticsearch.addresses | quote }}
            - name: COREMETRY_ES_INDEX
              value: {{ $.Values.logs.elasticsearch.index | quote }}
            {{- if $.Values.logs.elasticsearch.username }}
            - name: COREMETRY_ES_USERNAME
              value: {{ $.Values.logs.elasticsearch.username | quote }}
            {{- end }}
            {{- if $.Values.logs.elasticsearch.insecureSkipVerify }}
            - name: COREMETRY_ES_INSECURE
              value: "true"
            {{- end }}
            - name: COREMETRY_ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "coremetry.secretName" $ }}
                  key: es-password
                  optional: true
            - name: COREMETRY_ES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "coremetry.secretName" $ }}
                  key: es-api-key
                  optional: true
            {{- end }}
            {{- /* v0.10.958 — Rollouts v2 P1.6: ek env'ler chart env'lerinden
                   SONRA, yalnız extras'lı rollerde (monolitik şablonla aynı). */}}
            {{- if $role.extras }}
            {{- with $.Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
          {{- if $role.extras }}
          {{- with $.Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if $role.extras }}
            {{- with $.Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 3
          # v0.8.339 (HA audit H3) — liveness split from readiness.
          # /api/health 503s on overload ON PURPOSE (drain out of the LB);
          # pointing liveness at it made kubelet KILL overloaded pods,
          # destroying every buffered span. /livez = "process alive" only.
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 15
            failureThreshold: 4
          # Boot can legitimately take minutes (CH connect retry + schema
          # migrations); without a startupProbe the liveness budget killed
          # slow boots into a CrashLoop.
          startupProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
            failureThreshold: 30
          {{- if $role.resources }}
          resources: {{- toYaml $role.resources | nindent 12 }}
          {{- else }}
          resources: {{- toYaml $.Values.resources | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-config
        - name: tmp
          emptyDir: {}
        {{- if $role.extras }}
        {{- with $.Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end -}}
