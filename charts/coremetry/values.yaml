## Coremetry default values
## Override anything here with --set or a custom values file.

# ── Global image override ───────────────────────────────────────────────────
#
# When `global.imageRegistry` is set it REPLACES the .registry of every
# image in this chart (coremetry, ClickHouse, Redis, OTel Collector). Built
# for air-gapped clusters that mirror upstream images into an internal
# registry — e.g.:
#
#   global:
#     imageRegistry: docker.artifacthub.registry.example.com
#
# Mirrors expected at:
#   docker.artifacthub.registry.example.com/cosretr/coremetry:0.1.4
#   docker.artifacthub.registry.example.com/clickhouse/clickhouse-server:26.2.4.23-alpine
#   docker.artifacthub.registry.example.com/library/redis:7-alpine
#   docker.artifacthub.registry.example.com/otel/opentelemetry-collector-contrib:0.111.0
#
# Per-image overrides (.image.registry on each component) take priority
# over the global. Set imagePullSecrets here when the registry is private.
global:
  imageRegistry: ""
  imagePullSecrets: []

image:
  # Built and pushed by .github/workflows/release.yml on every v*.*.* tag.
  # Repo 2026-09-10'da `cosretr` organizasyonuna taşındı (v0.10.617): imajlar
  # ghcr.io/cosretr/* altında. Org paketleri PUBLIC yapılmadıysa pull için
  # global.imagePullSecrets gerekir; eski ghcr.io/cilcenk/* imajları taşınmadı.
  registry: "ghcr.io"
  repository: "cosretr/coremetry"
  tag: ""               # defaults to .Chart.appVersion
  pullPolicy: IfNotPresent
  pullSecrets: []       # legacy field — prefer global.imagePullSecrets

replicaCount: 1         # safe to scale up — Redis lock arbitrates background workers

# v0.6.2 — deployment topology.
#
#  monolithic  — one Deployment, mode=all (or unset; same thing).
#                replicaCount above applies. Suitable for SME /
#                POC / single-node installs. This is the default
#                and matches every Coremetry release up to v0.5.x.
#
#  distributed — three Deployments running the same image in
#                three roles via COREMETRY_MODE: ingest (OTLP
#                receivers + CH writers), api (HTTP + UI + SSE),
#                worker (evaluator + anomaly + topology agg +
#                Drain + problem AI explainer). Worker MUST
#                stay at 1 replica — its jobs are leader-elected
#                via Redis lock and a single replica avoids the
#                lock-contention overhead entirely.
#
# Both topologies use the same image, same Service for ClickHouse
# + Redis access. Switching is a one-line values change + rolling
# upgrade.
deployment:
  mode: monolithic      # monolithic | distributed
  # Rolling-update strategy for the monolithic Deployment (v0.8.193).
  # maxUnavailable: 0 keeps every pod Ready until its replacement is Ready, so
  # the headless ingest Service never loses all endpoints during a roll — which
  # is what wedged the OTel collector's gRPC exporter (zero-addresses) and made
  # apps stop ingesting until the collector was manually restarted. Needs surge
  # headroom for +1 pod; lower maxSurge / raise maxUnavailable on tight clusters.
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
  # Per-role config — only consulted in mode=distributed.
  roles:
    ingest:
      replicas: 2       # scale up for OTLP fan-in load
      # When empty, falls back to chart-wide .Values.resources.
      # Override per role for asymmetric prod budgets (ingest is
      # CPU/network-heavy, api is memory-heavy for serving the
      # browser, worker is bursty CH-heavy).
      resources: {}
    api:
      replicas: 2       # scale up for read HA + RPS
      resources: {}
    worker:
      replicas: 1       # DO NOT change — leader-elected workloads
      resources: {}
    # Runbook agent (v0.7.4) — executes automated runbook steps
    # (http/javascript/bash) in an isolated, non-data-plane pod. Off by
    # default; enable in distributed mode to run automated steps (the
    # monolithic all-pod already runs the agent in-process). Multiple replicas
    # are HA-safe — each automated step is claimed via a per-execution Redis
    # lock, so only one agent runs a given step.
    agent:
      enabled: false
      replicas: 1
      resources: {}

# Pod-level options
podAnnotations: {}
podLabels: {}
# Pod-level SC. Empty by default so OpenShift's restricted-v2 SCC can pick
# its own UID + fsGroup at admission time. Override only if you need to
# pin a UID (you'll then need an SCC binding to allow it).
podSecurityContext: {}

# Container-level SC. Conforms to "restricted-v2" (OpenShift) and
# "restricted" PSS — no explicit runAsUser so the platform assigns one
# from its allocated range; keeps the chart drop-in for OpenShift.
securityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities: { drop: ["ALL"] }
  seccompProfile:
    type: RuntimeDefault
nodeSelector: {}
tolerations: []
affinity: {}

# ── Ek env / envFrom / hacimler (Coremetry pod'ları) ─────────────────────────
#
# v0.10.958 — Rollouts v2 P1.6: operatörün KENDİ Secret/ConfigMap'lerini
# Coremetry pod'larına bağlama yolu. tokenRef kullanan entegrasyon
# system_settings'e düz token değil bir REFERANS yazar; internal/secretref
# onu pod içinde çözer. Referansın tam biçimi:
#
#   env:NAME   → NAME ortam değişkeninin değeri. NAME POSIX olmalı:
#                ^[A-Za-z_][A-Za-z0-9_]*$ (tire / nokta YOK).
#   file:/yol  → mutlak yoldaki dosyanın içeriği (boşluksuz yol).
#   İkisinde de baştaki/sondaki boşluk + newline kırpılır; boş değer = hata.
#   tokenRef alanı düz token kabul etmez. Thanos / Tempo / VictoriaMetrics /
#   Oracle'da ayrı bir saklı token/şifre alanı da var: ref doluysa ref
#   TERCİH edilir ve çözülemezse saklı değere DÜŞÜLMEZ (Thanos/Tempo/VM
#   isteği kimliksiz gider, Oracle bağlantısı hata verir).
#   Rotasyon: env: → pod restart (kubectl rollout restart); file: →
#   Secret'ı güncelle, kubelet mount'u yeniler, ayar ≤30 s'de yeniden çözülür
#   (subPath'li mount YENİLENMEZ — rotasyon için subPath kullanma).
#
# Bugün tokenRef okuyanlar: Remote Clusters (Thanos), Tempo, VictoriaMetrics,
# Oracle (passwordRef). Argo CD instance `tokenRef`'i (ayar anahtarı
# `argocd`, yalnız ref — düz token alanı yok) Rollouts v2 ile gelir; Azure
# DevOps PAT'in tokenRef'e taşınması P4.1'dedir (karar 20) — o zamana dek
# PAT Ayarlar'dan girilir, aşağıdaki DevOps satırı ileriye dönük örnektir.
#
# NEREYE render edilir: monolitik Deployment + distributed modda ref çözen
# üç rol: api (ayar/sorgu yolu, Test probe'ları), worker (arka plan işleri)
# ve ingest — VictoriaMetrics'e OTLP metrik YAZIMI yalnız ingest pod'unda
# koşar; VM tokenRef'i ingest'te çözülmezse yazım Authorization'sız gider
# (api'deki Test yine yeşil görünür). agent rolüne BİLİNÇLİ verilmez: runbook
# bash/javascript adımı koşar ve bash adımı pod ortamını devralır
# (internal/agent/executor.go) — sır orada okunabilirdi. Monolitik pod
# agent'ı süreç içinde koşar; bu ayrım gerekiyorsa distributed mod +
# deployment.roles.agent kullan.
#
# Varsayılan boş → hiçbir şey render edilmez (mevcut kurulumun manifesti
# bayt-bayt aynı). extraEnv chart'ın kendi env'lerinin SONUNA eklenir.
# Render anında reddedilenler (templates/_helpers.tpl coremetry.validateExtras):
# liste olmayan değer ya da eşleme olmayan öğe; chart'ın yönettiği env adları
# COREMETRY_MODE, COREMETRY_JWT_SECRET, COREMETRY_CH_PASSWORD,
# COREMETRY_INITIAL_PASSWORD (onlar için deployment.mode / secrets.*);
# chart'ın hacim adları config, tmp ve mount yolları /tmp, /app/config.yaml.
# Kubernetes kuralı: aynı ad hem env'de hem envFrom'da varsa env kazanır.
#
# Örnek (sentetik adlar) — iki Argo CD instance token'ı + bir DevOps PAT
# taşıyan AYRI bir Secret. Key'ler POSIX olsun: secretref yalnız POSIX adı
# çözer, eski Kubernetes envFrom'da geçersiz adlı key'i sessizce atlar.
#
#   oc create secret generic coremetry-integrations -n coremetry \
#     --from-literal=ARGOCD_TEAM_A_PROD_TOKEN='<argocd-token>' \
#     --from-literal=ARGOCD_TEAM_B_PROD_TOKEN='<argocd-token>' \
#     --from-literal=DEVOPS_PAT='<ado-pat>'
#
# (a) envFrom — Secret'ın bütün key'leri, önekle (önek binary'nin okuduğu
#     COREMETRY_* adlarıyla çakışmasın; docs/ENV.md):
#   envFrom:
#     - prefix: COREMETRY_SECRET_
#       secretRef:
#         name: coremetry-integrations
#   → Argo instance team-a-prod: tokenRef = env:COREMETRY_SECRET_ARGOCD_TEAM_A_PROD_TOKEN
#
# (b) extraEnv — tek key, açık adla. secrets.existingSecret'a EK key koyup
#     oradan da okunabilir (o Secret'ı envFrom'a verme: chart key'leri
#     jwt-secret gibi tireli, secretref çözemez; sırlar boşuna çoğalır):
#   extraEnv:
#     - name: COREMETRY_SECRET_DEVOPS_PAT
#       valueFrom:
#         secretKeyRef:
#           name: coremetry-integrations
#           key: DEVOPS_PAT
#   → tokenRef = env:COREMETRY_SECRET_DEVOPS_PAT
#
# (c) dosya — mount edilmiş Secret (pod restart'sız rotasyon):
#   extraVolumes:
#     - name: integration-tokens
#       secret:
#         secretName: coremetry-integrations
#   extraVolumeMounts:
#     - name: integration-tokens
#       mountPath: /var/run/secrets/coremetry/integrations
#       readOnly: true
#   → tokenRef = file:/var/run/secrets/coremetry/integrations/ARGOCD_TEAM_B_PROD_TOKEN
#
# restricted-v2 SCC: secret / configMap / emptyDir / projected hacimler
# uygundur; hostPath EKLEME (SCC reddeder). Secret hacminde defaultMode'u boş
# bırak: chart fsGroup sabitlemez, vanilla k8s'te 0400/0440 dosyayı non-root
# UID'ye okunmaz yapar. readOnlyRootFilesystem açık kalır — yazılabilir yol
# gerekiyorsa emptyDir ekle.
extraEnv: []
envFrom: []
extraVolumes: []
extraVolumeMounts: []

# Coremetry pod resources. Defaults target production banking-
# adjacent workloads where alert latency matters more than tight
# bin-packing. Burstable QoS — requests << limits so the pod
# schedules on a moderately-loaded node but the spike capacity
# is there when an incident lights up every panel at once.
# Tune down on dev clusters; tune up further (cpu=8 / mem=32Gi)
# for true high-volume (>5k spans/sec) shops.
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 16Gi

service:
  type: ClusterIP
  httpPort: 8088        # Web UI + REST API + direct OTLP/HTTP fallback
  grpcPort: 4317        # OTLP/gRPC ingest (apps + collector forward here)
  # v0.9.168 — dedicated OTLP/HTTP listener on the OTel-convention port 4318
  # (ingest / monolithic pods). Serves ONLY /v1/{traces,metrics,logs} — no Web
  # UI, no auth — so external collectors push OTLP/HTTP straight to :4318
  # without reaching the login-gated UI on :8088. HTTPS is edge-terminated at
  # the Route/Ingress/LB (the binary speaks plain HTTP — no in-binary cert).
  # Set false to omit the containerPort + Service port (also set env
  # COREMETRY_OTLP_HTTP_ADDR=off to stop the binary listening at all).
  otlpHttp: true
  otlpHttpPort: 4318
  annotations: {}
  # v0.6.21 — session affinity for MCP server sessions + SSE
  # streams. Pre-v0.6.21 the Service load-balanced every request
  # round-robin, which broke MCP (sessions are pod-local in-
  # memory state) and could split SSE streams across pods on
  # reconnect — the cross-pod Redis bridge re-fans events but a
  # mid-flight EventSource that re-routed lost the bridge
  # delivery of any events fired in the gap. Setting ClientIP
  # affinity pins a client (source IP + dest port tuple) to one
  # backend pod for sessionAffinityTimeoutSeconds, giving MCP +
  # SSE stable per-client routing without an ingress-layer
  # cookie. Set to "None" if you front-load-balance externally
  # (an ingress / cloud LB with sticky cookies is preferred at
  # scale because it survives client NAT — see chart NOTES.txt
  # for an nginx example).
  sessionAffinity: ClientIP   # ClientIP | None
  sessionAffinityTimeoutSeconds: 10800  # 3h — covers a long oncall

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: coremetry.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: coremetry-tls
  #   hosts: [coremetry.example.com]

# OpenShift native Route — preferred over Ingress on OCP because the
# router handles edge TLS automatically with the cluster cert. Use either
# `ingress.enabled` (vanilla k8s) OR `route.enabled` (OpenShift), not both.
route:
  enabled: false
  host: ""             # leave empty → OpenShift router auto-generates one
  annotations: {}
  tls:
    enabled: true
    termination: edge  # edge | reencrypt | passthrough
    insecureEdgeTerminationPolicy: Redirect

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ── Coremetry config block ───────────────────────────────────────────────────────
# Mirrors config.yaml. Anything here is rendered into a ConfigMap and mounted.
# Sensitive fields (jwtSecret, ClickHouse password, OIDC client secret,
# initialAdmin password) come from the Secret instead — see `secrets:` below.
config:
  retention:
    spansDays: 30
    logsDays: 30
    metricsDays: 7
  ingestion:
    batchSize: 50000   # v0.10.695 — 10k → 50k (CH denetimi 646 öneri 1; parça baskısı)
    bufferSize: 100000
    flushInterval: "5s"
    workers: 4
  auth:
    tokenTTL: "24h"
    initialAdmin: "admin@coremetry.local"
    oidc:
      enabled: false
      issuerUrl: ""
      clientId: ""
      redirectUrl: ""
      scopes: ["openid", "email", "profile"]
      displayName: "SSO"
      defaultRole: "viewer"
      allowedDomains: []

# Sensitive values land in a Secret. Override these or point existingSecret
# at a pre-created Secret with the same keys.
secrets:
  jwtSecret: ""             # leave empty in dev → Coremetry generates an ephemeral key
  clickHousePassword: ""
  oidcClientSecret: ""
  initialAdminPassword: "admin"
  # External Elasticsearch credentials (only consulted when logs.backend ==
  # "elasticsearch"). Set ONE of esApiKey OR (esUsername in logs block +
  # esPassword here). API key is preferred — it can be scoped to a single
  # index pattern and rotated without touching user accounts.
  esPassword: ""            # for HTTP basic auth (paired with logs.elasticsearch.username)
  esApiKey: ""              # base64 "id:api_key" — the `encoded` field from POST /_security/api_key
  existingSecret: ""        # if set, Coremetry reads JWT/CH/OIDC/init-admin/es from it instead

# ── ClickHouse ───────────────────────────────────────────────────────────────
#
# Two modes:
#  • `enabled: true` → bundle a single-node CH StatefulSet inside the chart
#    (good for dev + small prod, ~1-2GB RAM, single PVC). The Service is
#    auto-discovered by the coremetry pods.
#  • `enabled: false` → connect to an external CH (Altinity Operator,
#    ClickHouse Cloud, etc.) — point `external.addr` at it.
#
# Setting `external.addr` even when `enabled: true` overrides the in-cluster
# Service, so you can flip from bundled → external without disabling the
# StatefulSet immediately (use Pause Deletion / two-step migration).
clickhouse:
  enabled: true

  # DESTRUCTIVE: when true, a Helm pre-install + pre-upgrade Job
  # runs `coremetry --reset-schema` against the configured CH
  # (in-cluster or external) BEFORE the app pod starts. Drops the
  # whole database — every span, log, metric, dashboard, audit
  # event — so the install proceeds against a clean slate. Useful
  # for a "redeploy from scratch" against a long-lived external
  # CH that you don't want to manually wipe with clickhouse-client.
  #
  # Idempotent (DROP DATABASE IF EXISTS).
  #
  # v0.9.346 — the hook is PRE-INSTALL ONLY. It used to run on
  # pre-upgrade as well, which meant leaving this true after the
  # first install wiped the database on every routine `helm
  # upgrade` — silently, as part of a normal deploy. Values files
  # are sticky and "flip it back to false" was a comment, not a
  # guarantee.
  #
  # Leaving it true is now harmless on upgrades. To deliberately
  # reset an EXISTING install: `helm uninstall` + install, or run
  # the Job by hand — both things you have to mean.
  resetSchema: false

  external:
    # Single host: "ch.databases.svc:9000"
    # Multi-node external cluster: comma-separated seeds — the driver
    # round-robins / fails over across them, so a 4-node cluster
    # outside the OpenShift cluster can be wired without a separate
    # LB. Use 9000 for plain native, 9440 for native-TLS (set
    # `secure: true` below).
    #   addr: "ch1.example:9440,ch2.example:9440,ch3.example:9440,ch4.example:9440"
    addr: ""

  database: "coremetry"
  username: "default"
  # password comes from secret.clickHousePassword (or existingSecret); empty
  # password is honoured (in-cluster CH starts with ALLOW_EMPTY_PASSWORD=yes)

  # Native-TLS toggle. Set `secure: true` when pointing at LDAPS-style
  # 9440 endpoints (ClickHouse Cloud, internal CA-signed clusters,
  # etc.). `insecureSkipVerify` is the escape hatch for self-signed
  # certs — leave false in production once a CA bundle is loaded.
  secure: false
  insecureSkipVerify: false

  # 0 = self-size: the binary derives 5 ingest signals (spans, logs,
  # metrics, exemplars, span_links) x ingest workers + 8 read headroom
  # (58 with the default 10 workers). Pinning a literal here has starved
  # the flushers TWICE as the signal count grew (v0.8.205, v0.8.351) —
  # 'acquire conn timeout' + dropped batches under load. Only set a
  # number to CAP the pool below the derived size, knowingly.
  maxOpenConns: 0

  # ── Distributed / Replicated ClickHouse (multi-shard, multi-replica) ──
  # Set these when `external.addr` points at a sharded+replicated CH cluster
  # (Altinity Operator, self-managed Keeper/ZooKeeper). They flow to the app
  # as env vars, so an env-only deploy can flip cluster mode without a
  # config.yaml. Leave empty for single-node / bundled CH.
  #   clusterName  → every DDL gets `ON CLUSTER <name>` so schema lands on all
  #                  replicas (env COREMETRY_CH_CLUSTER_NAME).
  #   replicaPath  → Keeper/ZooKeeper prefix for the ReplicatedMergeTree path
  #                  argument; {shard}/{replica} macros expand per replica
  #                  (env COREMETRY_CH_REPLICA_PATH), e.g.
  #                  "/clickhouse/tables/{shard}/coremetry".
  #   shardKey     → expression the Distributed engine shards on
  #                  (env COREMETRY_CH_SHARD_KEY), e.g. "cityHash64(trace_id)".
  clusterName: ""
  replicaPath: ""
  shardKey: ""

  # In-cluster StatefulSet options (consulted only when enabled: true).
  # The official ClickHouse image runs as USER 101 (clickhouse) with a
  # fixed UID — fine on vanilla k8s, but on OpenShift you'll need to bind
  # `anyuid` SCC to the service account, OR use external CH:
  #   oc adm policy add-scc-to-user anyuid -z <release>-coremetry-clickhouse \
  #     -n <namespace>
  image:
    registry: ""                                 # empty = docker.io
    repository: clickhouse/clickhouse-server
    # v0.10.2 — PROD'UN KOŞTUĞU SÜRÜMÜN TAM AYNISI (operatör isteği).
    #
    # 24.8-alpine idi; prod ise 26.2.4.23 koşuyor (prod'un CH'si DIŞ, yani
    # bu pin onu yönetmiyor — yalnız lokal/dev/compose'u belirliyor). İki
    # major sürümlük bu boşluk gerçek bir hata sınıfı üretti: lokalde
    # geçen bir sorgu prod'da CH 26'nın yeni analizöründe alias çakışması
    # (code 47) verdi. Lokalde göremediğim bir şeyi prod'da bulmak, bu
    # ortamın var olma sebebinin tam tersi.
    #
    # Floating minor (`26.2-alpine`) DEĞİL, tam patch: o etiket bugün
    # 26.2.19.43'e çözülüyor ve "eşit olsun" isteğini yarım bırakırdı.
    # Patch'ler artık bilinçli bir bump ile gelir — bir banka kurulumunda
    # zaten istenen davranış.
    tag: "26.2.4.23-alpine"
    pullPolicy: IfNotPresent
  storage:
    size: 20Gi
    storageClassName: ""   # empty = cluster default
    accessModes: ["ReadWriteOnce"]
  # ClickHouse pod resources. The defaults handle ~100-500 spans/
  # sec with the bundled MergeTree schema. At banking scale
  # (>5k spans/sec) bump to cpu="16", memory=32Gi and provision
  # a dedicated node pool. CH's memory usage scales with
  # `max_memory_usage` per query + the merge buffer; the limits
  # below allow ~1 GB headroom over the default query budget.
  resources:
    requests: { cpu: "1",  memory: 2Gi }
    limits:   { cpu: "8",  memory: 16Gi }
  service:
    type: ClusterIP
    nativePort: 9000        # CH native protocol — coremetry connects here
    httpPort: 8123          # Useful for ad-hoc clickhouse-client / debugging
  podSecurityContext: {}    # OpenShift assigns UID + fsGroup automatically
  # Container-level SC for the bundled CH. Default = hardened (works on
  # OpenShift, where the SCC injects a runAsUser, or with anyuid bound).
  # The clickhouse-server image's USER is root, so on VANILLA k8s (minikube,
  # kind, plain kubeadm) — where no SCC injects a uid — runAsNonRoot:true is
  # REJECTED at admission. Set this to {} there (see values-minikube.yaml) so
  # the image runs as its own user.
  containerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities: { drop: ["ALL"] }
    seccompProfile: { type: RuntimeDefault }

# ── Logs read backend ───────────────────────────────────────────────────────
#
# Coremetry's ingest pipeline always writes logs to ClickHouse. This block
# only changes the READ side — pick "elasticsearch" to point /api/logs at
# an external ES cluster that your existing shipping pipeline already
# populates (Filebeat / Logstash / OTel Collector ES exporter), without
# re-indexing.
#
# Auth precedence (per https://github.com/elastic/go-elasticsearch):
#   1. apiKey   — preferred for prod; scoped + rotatable
#   2. username + password (basic auth)
#   3. no auth  — only sane for `xpack.security.enabled: false` clusters
#
# In all cases the field paths inside each ES document default to the OTel
# Collector ES exporter's ECS mapping (trace.id, span.id, service.name,
# message, log.level, @timestamp). Override per-deployment if your
# shipping pipeline uses a different shape.
logs:
  backend: clickhouse        # "clickhouse" (default) | "elasticsearch"
  elasticsearch:
    addresses: []            # e.g. ["https://es.example.com:9200"]
    index: "logs-otel-default"
    username: ""             # leave empty when using apiKey or no auth
    insecureSkipVerify: false # true only for self-signed certs in dev/test
    # password / apiKey come from the Secret (secrets.esPassword,
    # secrets.esApiKey) so they don't end up in `helm get values` output.
    #
    # LEAST-PRIVILEGE / READ-ONLY ES USER. Coremetry only READS from
    # Elasticsearch — it never indexes, bulk-writes, creates indices, or edits
    # mappings (the write path is ClickHouse). The entire query surface is:
    #   _search · _msearch · _terms_enum · _eql/search · _sql · PIT open+close
    #       → the index `read` privilege
    #   _mapping · _ilm/explain · field discovery
    #       → the index `view_index_metadata` privilege
    #   _cat/indices (resolve the dated indices behind the pattern)
    #       → the cluster `monitor` privilege (read-only monitoring, not a write)
    # Scope the ES user / API key to exactly this — nothing more is needed:
    #
    #   POST /_security/role/coremetry_logs_ro
    #   { "cluster": ["monitor"],
    #     "indices": [{ "names": ["logs-otel-*"],          # match .index below
    #                   "privileges": ["read", "view_index_metadata"] }] }
    #
    # API-key form (preferred — scoped + rotatable; feeds secrets.esApiKey):
    #   POST /_security/api_key
    #   { "name": "coremetry-logs-ro",
    #     "role_descriptors": { "coremetry_logs_ro": {
    #       "cluster": ["monitor"],
    #       "indices": [{ "names": ["logs-otel-*"],
    #                     "privileges": ["read", "view_index_metadata"] }] } } }

# Redis (cache + distributed lock). Setting `enabled: true` creates a small
# in-cluster Deployment good for dev/small prod. For high-throughput
# deployments use a managed Redis and set `external.url` instead.
redis:
  enabled: true
  # Container-level SC for the bundled Redis. Default = hardened (OpenShift,
  # which injects a runAsUser). The redis image's USER is root, so on vanilla
  # k8s set this to {} (see values-minikube.yaml) so it can start. Data is
  # ephemeral (appendonly + RDB off) so uid churn is harmless.
  containerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: ["ALL"] }
    seccompProfile: { type: RuntimeDefault }
  external:
    url: ""               # e.g. "redis://my-redis.svc:6379/0" — overrides in-cluster
  image:
    registry: ""          # empty = docker.io
    repository: library/redis
    tag: 7-alpine
  # Redis sidecar (cache + distributed lock). Even a busy
  # Coremetry rarely pushes Redis past 50 MB resident — keys are
  # short and TTLs are seconds — but giving it room means a
  # cardinality spike (lots of distinct dashboard keys) doesn't
  # evict hot entries.
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: "1",  memory: 1Gi }

# Self-observability (v0.7.1) — Coremetry instruments its OWN pods (api /
# worker / all roles) and ships those traces + metrics via OTLP so coremetry-*
# shows up on /services like any monitored app. Blank endpoint = default to the
# bundled <release>-otelcol Service. The pure-ingest pod self-disables (avoids
# a span-about-receiving-spans loop). If you run WITHOUT the bundled collector,
# set endpoint to the ingest Service, e.g. "<release>-ingest:4317".
selfObs:
  enabled: true
  endpoint: ""           # blank → <fullname>-otelcol:<otelCollector.service.grpcPort>
  sampleRate: "0.1"

# OTel Collector — runs as a sidecar deployment, accepts OTLP from apps,
# forwards to coremetry over gRPC. Disable if you already operate a collector
# elsewhere and point apps directly at coremetry's gRPC service.
otelCollector:
  enabled: true
  image:
    registry: ""          # empty = docker.io
    repository: otel/opentelemetry-collector-contrib
    tag: "0.111.0"
  service:
    type: ClusterIP
    grpcPort: 4317
    httpPort: 4318
  # k8sattributes (v0.10.92) — İZLENEN TÜM servislerin telemetrisine
  # k8s kimliği (namespace/deployment/pod/uid/node/container) ekler.
  # VARSAYILAN KAPALI: ClusterRole + ClusterRoleBinding ister
  # (otelcol-rbac.yaml) ve cluster-scoped kaynak ancak açık kararla
  # kurulur. Coremetry'nin KENDİ pod'u bundan bağımsız, downward API
  # yoluyla kimlikli (v0.10.91).
  k8sattributes:
    enabled: false
  # OTel Collector resources. At ~5k spans/sec a single collector
  # uses ~500m CPU + 256Mi memory; the limits below leave room
  # for a 3-5× burst (deploy event, traffic spike) before the
  # exporter queue back-pressures. Scale collector replicas
  # horizontally if you outgrow these.
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { cpu: "2",  memory: 2Gi }
  # Cloud fan-out (v0.6.70) — additionally forward EVERY signal to a second
  # OTLP/HTTP backend (OneUptime, Grafana Cloud, any OTLP/HTTP ingest) ALONGSIDE
  # the in-cluster Coremetry ingest. The collector dual-exports; app/demo pods
  # are unchanged. Default off. The auth token is NEVER inlined here — provide
  # it via a Secret and the chart injects it as ONEUPTIME_TOKEN, referenced by
  # ${env:ONEUPTIME_TOKEN} in the exporter header:
  #   kubectl create secret generic coremetry-oneuptime \
  #     -n <namespace> --from-literal=token=<your-ingestion-token>
  oneuptime:
    enabled: false
    endpoint: "https://oneuptime.com/otlp"   # otlphttp base; /v1/{signal} auto-appended
    tokenHeader: "x-oneuptime-token"          # header name the backend expects
    existingSecret: ""                         # Secret holding the ingestion token
    tokenSecretKey: "token"                    # key within that Secret
  # Dual-ship LOGS to Elasticsearch (v0.7.14) — in ADDITION to the in-cluster
  # Coremetry OTLP export. Pair with logs.backend=elasticsearch so Coremetry
  # READS the same logs back (CH stays the write store; this is the operator's
  # ES shipping pipeline, done by the collector). ECS mapping → @timestamp /
  # message / service.name / log.level, which Coremetry's ESStore reads as-is.
  # Default off.
  elasticsearch:
    enabled: false
    endpoint: "http://elasticsearch:9200"   # ES HTTP endpoint the collector ships to
    logsIndex: "coremetry-logs"              # index/data-stream the logs land in
    apiKey: ""                               # base64 "id:api_key" — when set, the collector writes via the ES ApiKey header (no basic auth); required for a security-enabled ES

# Go demo — cmd/demo synthetic retail-banking traffic generator. Emits a full
# multi-service OTLP/HTTP firehose (traces + logs + metrics + pprof profiles)
# from its own internal services map (mobile-bff → api-gateway → core-banking),
# so it populates the service graph / topology / database views without any
# auto-instrumentation. Egress-only client — no inbound Service. Off by default;
# flip on for a "see realistic traffic flow end-to-end" demo install.
goDemo:
  enabled: false
  image:
    registry: "ghcr.io"
    repository: cosretr/coremetry-go-demo
    tag: ""               # defaults to .Chart.appVersion
    pullPolicy: IfNotPresent
  # Scenarios per second the generator drives. ~3 rps is a comfortable demo
  # firehose; raise for a denser graph, lower to keep ingest light.
  rps: 3
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits:   { cpu: "1",  memory: 256Mi }
  # Extra env to inject into the pod (the OTLP endpoint + rps ride the binary's
  # CLI flags, wired automatically; this is for anything else you need).
  extraEnv: []

serviceAccount:
  create: true
  annotations: {}
  name: ""
