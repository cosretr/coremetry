<!doctype html>
<html lang="en" data-theme="redhat">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coremetry</title>
    <meta name="description" content="Enterprise OpenTelemetry APM" />
    <!--
      Favicon (v0.9.495) — bu satır ÖNCE /favicon.ico'yu gösteriyordu
      ama o dosya public/ içinde HİÇ var olmamıştı. Go spaHandler
      uzantılı her yolu gerçek 404 sayar (SPA fallback yok,
      api.go:10923) → her sekme tarayıcının boş varsayılan ikonunu
      çiziyordu.

      Varlıklar operatör talimatıyla opentelemetry.io'nun kendi
      favicon'undan alındı; SVG, CNCF artwork deposundaki resmî
      OpenTelemetry renkli ikonunun aynısı (dosyanın içindeki
      provenance yorumuna bak). public/opentelemetry.{svg,png}
      DOKUNULMADI — onları TelescopeIcon sidebar/login/public
      sayfalarında çiziyor ve elle sadeleştirilmiş ayrı bir kopya.

      SVG önce (her boyutta net), .ico bunu yok sayan motorlar için
      (16x16 + 32x32 taşıyor), apple-touch-icon iOS ana-ekran pin'i
      için 512x512 PNG.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32" />
    <link rel="apple-touch-icon" href="/opentelemetry.png" />
    <!--
      Inline theme boot — applies the saved theme BEFORE first
      paint so the operator never sees a flash of the wrong
      palette when a session loads. Was inline in layout.tsx;
      moves here verbatim under Vite (no SSR).
    -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('coremetry-theme');
          // v0.8.285 — default to 'redhat' (PatternFly/OpenShift) for new
          // sessions; a saved pref still wins so existing users keep their pick.
          if (t !== 'light' && t !== 'dark' && t !== 'redhat') t = 'redhat';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'redhat');
        }
      })();
    </script>
    <!--
      Inline density boot (v0.5.452) — mirrors the theme bootstrap
      above so the operator never sees a flash of "comfortable"
      density before React's useEffect hydrates the saved choice.
      Same FOUC-avoidance pattern; 3 levels per lib/density.ts
      (v0.10.933: the retired "spacious" falls back to comfortable).
    -->
    <script>
      (function() {
        try {
          var d = localStorage.getItem('coremetry-density');
          var allowed = { comfortable:1, compact:1, dense:1 };
          if (!allowed[d]) d = 'comfortable';
          document.documentElement.setAttribute('data-density', d);
        } catch (e) {
          document.documentElement.setAttribute('data-density', 'comfortable');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
